{% load crispy_forms_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   
 <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh; background:#fafafa;">
    <div class="card shadow-lg p-4 col-md-4 border-0" style="border-radius: 20px;">
        <!-- ERROR MESSAGE FOR INVALID LOGIN -->
        {% if form.errors %}
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                Invalid username or password!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endif %}
        <h4 class=" text-center fw-bold m-0" style="color:#4169E1"><img src="{% static "image/Scanteen.png" %}" style="width:40px;height:40px; margin-right:8px;">CampusBite</h4>
        <h3 class="text-center mb-4 fw-bold" style="color:#4169E1;">Login</h3>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.username|as_crispy_field }}
            </div>

            <div class="mb-3">
                {{ form.password|as_crispy_field }}
            </div>

            <button type="submit" 
                    class="btn w-100 mt-2"
                    style="background:#4169E1; color:white; font-weight:600; border-radius:10px; padding:10px 0; font-size:1.1rem;">
                Login
            </button>
            <p class="text-center mt-2">
              <a href="{% url 'send_otp' %}" 
                class="fw-semibold text-decoration-none"
                  style="color:#4169E1;">
                   Forgot Password?
                      </a>
                      </p>
        </form>
        <p class="text-center mt-2" style="font-size:0.9rem;">
            Don't have a account? <a href="{% url "register" %}" class="fw-bold text-decoration-none" style="color:#4169E1;">Create an account</a>
        </p>
    </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
