{% load crispy_forms_tags %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center"
     style="min-height: 100vh; background:#fafafa;">

    <div class="card shadow-lg p-4 col-md-5 border-0"
         style="border-radius: 20px;">

        <!-- SmartCanteen Logo & Heading -->
        <h4 class="text-center fw-bold m-0" style="color:#4169E1;">
            <img src="{% static 'image/Scanteen.png' %}"
                 style="width:40px; height:40px; margin-right:8px;">
            SmartCanteen
        </h4>

        <h3 class="text-center mb-2 mt-2 fw-bold"
            style="color:#4169E1;">
            Create Account
        </h3>

        <p class="text-center text-secondary mb-4">
            Join us and start ordering your favourite food
        </p>

        <!-- Registration Form -->
        <form method="post" class="mt-2">
            {% csrf_token %}

            {{ register_form|crispy }}

            <button type="submit"
                    class="btn w-100 mt-3"
                    style="background:#4169E1;
                           color:white;
                           font-weight:600;
                           border-radius:10px;
                           padding:10px 0;
                           font-size:1.1rem;">
                Create Account
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center mt-3"
           style="font-size:0.9rem;">

            Already have an account?

            <a href="{% url 'login' %}"
               class="fw-bold text-decoration-none"
               style="color:#4169E1;">
                Login
            </a>

        </p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
